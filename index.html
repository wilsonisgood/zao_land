function warmGuide(){return `<section class="card"><h2>認識暖谷領</h2>${tabs(['地理','行政','商店'],state.warmInfoTab,'warm-info')}${state.warmInfoTab==='地理'?`<p>${esc(warmAtlas.lead)}</p>${warmAtlas.geography.namedWater.map(w=>`<p><strong>${w.name}</strong><br><small>${esc(w.note)}</small></p>`).join('')}`:state.warmInfoTab==='行政'?`<p>四個主要聚落為映川鎮、泉霧庄、青芽庄、禾川庄。各聚落保有地方自治，以河谷聚落聯議制處理水利、道路、教育及災害應變。映川鎮是協調中心，合溪渡隸屬映川鎮。</p>${warmAtlas.cityZones.map(z=>`<details><summary>${esc(z.name)}</summary><p class="mini">${esc(z.functions.join('、'))}</p></details>`).join('')}`:`${warmAtlas.commerce.brands.map(b=>`<details><summary>${b.name}</summary><p>${esc(b.role)}</p><p class="mini">主要分布：${esc(b.primary.join('、'))}</p><p class="mini">地方商品：${esc(b.offerings.join('、'))}</p>${b.absent.length?`<p class="mini muted">不設一般門市：${esc(b.absent.join('、'))}</p>`:''}</details>`).join('')}<h3 style="margin-top:20px">公共與產業服務</h3>${warmAtlas.features.map(f=>`<details><summary>${f.name}</summary><p class="mini">${esc(f.zone)}</p><p>${esc(f.functions.join('、'))}</p>${f.definition?`<p>${esc(f.definition)}</p>`:''}</details>`).join('')}`}</section><details class="card"><summary>地圖與正式設定的差異</summary><p class="mini">圖示位置尚不是精確地址。主檔中的茶露舖、郵舍、診療所及星契所主要位於映川鎮；百川集、旅會及河安站在合溪渡，風行社在其外緣。牧生院是後續地圖新增內容，應變設施尚未對應正式機構。</p></details>`}

function render(){if(state.onboardingDone){let day=localDate();if(!state.loginDates.includes(day))state.loginDates.push(day);if(state.region)recordVisit('region:'+state.region,startingRegions.find(r=>r.id===state.region)?.name||state.region);}document.body.classList.toggle('light',state.light);let h='<div class="notice">互動試稿 · 所有購買皆為模擬，不會產生真實付款</div>';if(state.page==='welcome')h+=pageHeader('朝霧大陸')+`<section class="intro"><img class="intro-map" src="maps/continent.jpg" alt="朝霧大陸七個區域"><h2>在風與霧之間，遇見一段故事。</h2><p class="muted">朝霧大陸有七個不同的地方。港灣的人等待歸來，河谷的人照料土地，山林的人為彼此留下道路。</p><p class="muted">你會收到居民的信，也能寫下自己的回應。先選一處想停留的風景，讓旅程從那裡開始。</p><button class="primary" data-action="start">開始探索</button></section>`;

function setupMap(){let el=$('#map'),pts=new Map(),prevDist=0,prevMid=null;if(!state.mapReady)mapCenter();else mapApply();el.onwheel=e=>{e.preventDefault();let rect=el.getBoundingClientRect();mapZoom(state.zoom*Math.exp(-e.deltaY*.002),e.clientX-rect.left,e.clientY-rect.top)};el.onpointerdown=e=>{if(e.target.closest('button'))return;pts.set(e.pointerId,[e.clientX,e.clientY]);el.setPointerCapture(e.pointerId);el.classList.add('dragging');prevDist=0;prevMid=null};el.onpointermove=e=>{if(!pts.has(e.pointerId))return;let old=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1){state.x+=e.clientX-old[0];state.y+=e.clientY-old[1]}else{let a=[...pts.values()],rect=el.getBoundingClientRect();let d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),mid=[(a[0][0]+a[1][0])/2-rect.left,(a[0][1]+a[1][1])/2-rect.top];if(prevDist)mapZoom(state.zoom*d/prevDist,...mid);if(prevMid){state.x+=mid[0]-prevMid[0];state.y+=mid[1]-prevMid[1]}prevDist=d;prevMid=mid}mapApply()};el.onpointerup=el.onpointercancel=e=>{pts.delete(e.pointerId);prevDist=0;prevMid=null;if(!pts.size)el.classList.remove('dragging')};el.onkeydown=e=>{if(e.target!==el)return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')state.x+=30;if(e.key==='ArrowRight')state.x-=30;if(e.key==='ArrowUp')state.y+=30;if(e.key==='ArrowDown')state.y-=30;if(e.key==='+')mapZoom(state.zoom+.25);if(e.key==='-')mapZoom(state.zoom-.25);mapApply()}}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled||busy)return;let d=b.dataset;if(d.nav){if(!state.onboardingDone)return;state.page=d.nav;render();return}if(d.startRegion){state.region=d.startRegion;state.choice='';state.draft='';setFirstLetter();render();return}if(d.mail){if(d.mail==='draft'){state.page='reply'}else if(d.mail.startsWith('reply')){sheetOpen({type:'note',text:state.replies[+d.mail.slice(5)].text});return}else{state.selectedMail=d.mail;state.choice='';state.page='detail'}render();return}if(d.choice){state.choice=d.choice;render();return}if(d.warmInfo){state.warmInfoTab=d.warmInfo;render();return}if(d.collection){state.collectionTab=d.collection;render();return}if(d.importantNote!==undefined){let i=+d.importantNote;state.noteMeta[i]={...(state.noteMeta[i]||{}),important:!state.noteMeta[i]?.important};render();return}if(d.feed){recordVisit('shop:'+d.feed,shops.find(x=>x.id===d.feed).name);state.openFeeds=state.openFeeds.includes(d.feed)?state.openFeeds.filter(x=>x!==d.feed):[...state.openFeeds,d.feed];event('world_shop_feed_open',{shop_id:d.feed});render();return}if(d.shop){recordVisit('shop:'+d.shop,shops.find(x=>x.id===d.shop).name);event('world_shop_purchase_open',{shop_id:d.shop,source:b.classList.contains('pin')?'pin':'list'});sheetOpen({type:'shop',id:d.shop});return}if(d.region){if(Date.now()>=release){render();return}event('world_locked_region_open',{region_id:d.region});sheetOpen({type:'locked',id:d.region});return}if(d.product!==undefined){modal.product=+d.product;event('world_product_selected',{shop_id:modal.id,product_id:d.product});sheetRender();return}if(d.filter){state.filter=d.filter;state.page='letters';close();render();return}if(d.hour!==undefined||d.minute!==undefined){pickTime(d.hour!==undefined?'hour':'minute',+(d.hour??d.minute));return}if(d.editNote!==undefined){sheetOpen({type:'note',index:+d.editNote,text:state.chronicles[+d.editNote]});return}if(d.removeNote!==undefined){state.chronicles.s switch(d.action){case'theme':state.light=!state.light;render();break;case'start':state.started=true;state.page='connect';render();break;case'connect-continent':busy=true;$('#connect-button').disabled=true;$('#connect-button').textContent='正在連接…';$('#connect-status').textContent='信件的航路正在展開，即將抵達朝霧大陸。';$('.connection-orbit').classList.add('connecting');$('.connect-intro [data-action="intro-back"]').disabled=true;setTimeout(()=>{busy=false;state.page='select-region';render()},1700);break;case'intro-back':state.page='welcome';render();break;case'arrive':if(!state.region)return;setFirstLetter();state.page='arrival';render();break;case'choose-again':state.page='select-region';render();break;case'receive-first':state.page='first-envelope';render();break;case'arrival-back':state.page='arrival';render();break;case'open-first':state.selectedMail='first';state.page='detail';render();break;case'envelope-back':state.page='first-envelope';render();break;case'restart-intro':state.onboardingDone=false;state.region='';state.draft='';state.choice='';state.page='welcome';render();break;case'read-first':state.selectedMail='first';state.choice='';state.page='detail';render();break;case'write':if(!state.draft)state.draft=state.choice?state.choice+'。\n\n':'';state.page='reply';render();break;case'skip':if(!state.onboardingDone)return;state.choice='';state.page='today';render();toast('先把信收藏，想回覆時再來。');break;case'cancel-reply':state.page='detail';render();break;case'send':if(!state.draft.trim())return;state.replies.push({to:(mails.find(m=>m.id===state.selectedMail)||first).sender,text:state.draft,mailId:state.selectedMail,status:'waiting',date:new Date().toISOString()});state.lastReply=state.draft;state.draft='';if(!state.onboardingDone){state.onboardingDone=true;if(state.region&&state.region!=='mist'&&!state.unlock.includes(state.region))state.unlock.push(state.region);state.page='today';render();toast('回信已交給郵舍，歡迎開始你的日常。')}else{state.page='sent';render()}break;case'keep':sheetOpen({type:'note',text:state.lastReply||''});break;case'new-note':sheetOpen({type:'note',text:''});break;case'save-note':{let t=$('#note').value.trim();if(!t){toast('請先寫下一段想收藏的話。');return}if(modal.index===undefined){state.chronicles.push(t);state.noteMeta.push({date:new Date().toISOString(),important:false})}else state.chronicles[modal.index]=t;close();state.page='chronicle';render();break}case'drawer':event('letters_drawer_open');sheetOpen({type:'drawer'});break;case'settings':state.settings=!state.settings;sheetRender();break;case'notify':state.notification=!state.notification;save();sheetRender();break;case'help':sheetOpen({type:'help'});break;case'close':close();break;case'time':event('letters_change_time_open',{current_time:state.time});sheetOpen({type:'time',time:state.time});break;case'time-back':modal={type:'drawer'};state.settings=true;sheetRender();break;case'time-next':if(state.timeOwned){state.time=modal.time;save();modal={type:'success',title:'來信時間已更新',message:`每日 ${state.time} 來信，修改不需再次購買。`,destination:'letters'};sheetRender()}else{event('letters_change_time_submit',{selected_time:modal.time,price:90});modal={type:'confirm',kind:'time',time:modal.time,name:'更改來信時間',price:90};sheetRender()}break;case'shop-next':{let s=shops.find(s=>s.id===modal.id),[name,price]=s.products[modal.product];if(state.owned.includes(s.id+':'+name)){toast('這件商品已取得，不會再次收費。');return}modal={...modal,type:'confirm',kind:'shop',name,price};sheetRender();break}case'pass-benefits':event('world_early_pass_start',{region_id:modal.id,price:90});modal.type='benefits';sheetRender();break;case'pass-back':modal.type='locked';sheetRender();break;case'pass-confirm':modal={...modal,type:'confirm',kind:'pass',name:regions.find(r=>r.id===modal.id).name+'提早通行',price:90};sheetRender();break;case'confirm-back':modal.type=modal.kind==='shop'?'shop':modal.kind==='pass'?'benefits':'time';modal.error=false;sheetRender();break;case'pay':forceFail=$('#fail').checked;busy=true;sheetRender();setTimeout(()=>{busy=false;if(forceFail){modal.error=true;sheetRender();return}let tx='demo-'+Date.now();let message='已取得 '+modal.name,destination=modal.kind==='time'?'letters':'world',title='已取得 '+modal.name;if(modal.kind==='shop')state.owned.push(modal.id+':'+modal.name);if(modal.kind==='pass'){state.unlock.push(modal.id);title=regions.find(r=>r.id===modal.id).name+'已解鎖';message='地圖霧區已移除，正式開放後仍保留。';event('world_early_pass_success',{region_id:modal.id,transaction_id:tx})}if(modal.kind==='time'){state.timeOwned=true;state.time=modal.time;message=`每日 ${state.time} 來信，後續可免費修改。`;event('letters_change_time_success',{selected_time:modal.time,transaction_id:tx})}save();modal={type:'success',title,message,destination};render();sheetRender()},650);break;case'success-close':{let dest=modal.destination;close();state.page=dest;render();if(dest==='letters'){state.settings=true;sheetOpen({type:'drawer'})}break}case'toggle-map-style':state.mapStyle=state.mapStyle==='flat'?'realistic':'flat';render();break;case'toggle-map-area':state.mapArea=state.mapArea==='warm'?'continent':'warm';state.mapReady=false;render();break;case'zoomin':mapZoom(state.zoom+.25);break;case'zoomout':mapZoom(state.zoom-.25);break;case'resetmap':mapCenter();break}});
document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){close();return}if(e.key==='Tab'){let nodes=[...$('#modal').querySelectorAll('button:not(:disabled),input,textarea')];let a=nodes[0],z=nodes.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});setInterval(()=>{if($('#today-clock'))$('#today-clock').textContent=todayClock();if($('#today-date'))$('#today-date').textContent=todayDate();if($('#today-heading-date'))$('#today-heading-date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',weekday:'long',month:'short',day:'numeric'}).format(new Date());if($('#countdown'))$('#countdown').textContent=countdown();if(Date.now()>=release&&modal?.type==='locked'){close();render()}},1000);render();
