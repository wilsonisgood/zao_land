<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <meta name="description" content="朝霧大陸七大行政區生活百科。探索商鋪、市集、地理人文、地方特產與公共服務。">
  <title>朝霧大陸｜七大行政區生活百科</title>
  <style>
    :root {
      --paper:#f5f2e9; --paper2:#fffcf7; --ink:#1c342f; --ink2:#304e48; --muted:#6a7971; --stroke:#dedfd6;
      --green:#2f594a; --dark:#18392f; --highlight:#e8eddd; --gold:#b79a62;
      --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
      --serif: "Songti TC", "Noto Serif TC", "Iowan Old Style", Georgia, serif;
      --shadow: 0 10px 34px rgba(32,48,37,.045);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;font-size:14px;letter-spacing:.012em}
    button,input,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #91b8a6;outline-offset:3px}
    [hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .wrap{max-width:1510px;margin:auto;padding:0 36px}
    .topbar{position:sticky;top:0;z-index:25;background:rgba(249,247,241,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(63,83,66,.13)}
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;height:78px}
    .brand{display:flex;align-items:center;gap:13px;border:0;background:none;color:var(--ink);padding:0;text-align:left}
    .brand-mark{width:42px;height:42px;border:1px solid #59776b;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--dark);color:#f7ecce;font-family:var(--serif);font-size:21px;line-height:1}
    .brand-mark:before,.brand-mark:after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.35);border-radius:50%}.brand-mark:after{inset:11px;opacity:.3}
    .brand-name{display:block;font-family:var(--serif);font-size:21px;font-weight:800;letter-spacing:.17em;line-height:1.2}
    .brand-sub{display:block;font:10px Georgia,serif;letter-spacing:.17em;color:#697971;margin-top:4px}
    .toplinks{display:flex;align-items:center;gap:3px;white-space:nowrap}
    .toplinks button{border:0;background:none;color:#5f7066;padding:11px 14px;border-radius:9px;font-size:13px}
    .toplinks button:hover,.toplinks button.is-active{color:#164b3b;background:#e9efe7}
    .search-open{background:#fffdf8;color:#65756c;border:1px solid #d7dcd2;border-radius:12px;display:flex;align-items:center;gap:12px;min-width:219px;justify-content:space-between;padding:10px 12px;font-size:12px}
    .search-icon{font-size:20px;line-height:1}.shortcut{font-size:10px;border:1px solid #e0e1d8;padding:2px 5px;border-radius:5px;color:#79867e;background:#f7f6f0}
    .overline{text-transform:uppercase;font-family:Georgia,serif;font-size:11px;font-weight:600;letter-spacing:.23em;color:#907950}
    .mast{padding:42px 0 19px;display:flex;gap:15px;align-items:center;justify-content:space-between}
    .mast p{margin:0;color:#879087;font-size:12px}.mast span{font-weight:700;color:#4f6a5b}
    .work{display:grid;grid-template-columns:262px minmax(0,1fr);gap:32px;align-items:start;padding-bottom:65px}
    .sidebar{position:sticky;top:100px;max-height:calc(100vh - 120px);overflow:auto;padding:20px 11px 16px 0;scrollbar-width:thin}
    .aside-label{font-family:Georgia,serif;font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:#85918a;padding:0 12px;margin-bottom:12px}
    .aside-all,.region-btn{width:100%;text-align:left;border:0;display:flex;align-items:center;border-radius:12px;color:#4b6256;background:transparent;padding:13px 12px;gap:13px}
    .aside-all{margin-bottom:20px;font-weight:750;font-size:14px}
    .aside-all:hover,.aside-all.current,.region-btn:hover,.region-btn.current{background:#e4ebdf;color:#153c30}
    .region-btn{padding:12px;margin-bottom:4px}
    .region-btn.current{background:#fffdf8;border:1px solid #d9e2d5;box-shadow:0 3px 12px rgba(35,49,38,.06)}
    .region-number{display:grid;place-items:center;flex-shrink:0;width:32px;height:32px;border-radius:10px;color:var(--region-accent);background:var(--region-pale);font-family:Georgia,serif;font-size:12px;font-weight:bold}
    .region-btn strong{font-size:14px;display:block;line-height:1.35}.region-btn small{font-size:11px;color:#869089;display:block;margin-top:4px}
    .aside-bottom{border-top:1px solid var(--stroke);margin-top:22px;padding:22px 12px;color:#829087;font-size:11px;line-height:1.8}
    .aside-bottom b{color:#4c6859;font-weight:650}
    .main{min-width:0}
    .paper-card{background:#fffcf7;border:1px solid #e7e5d9;border-radius:20px;box-shadow:var(--shadow)}
    .world-hero{min-height:375px;background:#213f38;color:#fbf8ed;border-radius:22px;display:grid;grid-template-columns:1.02fr .98fr;overflow:hidden;position:relative}
    .world-hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 41px,rgba(255,255,255,.025) 42px);pointer-events:none}
    .world-hero .world-copy{position:relative;z-index:1;padding:62px 48px 55px}
    .world-hero .overline{color:#c0ceaa}.world-hero h1{font-family:var(--serif);font-size:clamp(38px,4.5vw,62px);line-height:1.3;font-weight:750;letter-spacing:.05em;margin:16px 0 17px}
    .world-hero p{color:#d2dcd2;max-width:460px;font-size:14px;line-height:2.1;margin:0 0 24px}
    .world-illustration{min-height:340px;display:flex;align-items:stretch;justify-content:stretch;position:relative;overflow:hidden}
    .world-illustration svg{width:100%;height:100%;min-height:360px}
    .world-illustration .scene-note{position:absolute;bottom:16px;right:19px;font-size:9px;letter-spacing:.14em;color:#d5e4d6;opacity:.8}
    .cta{background:#efdfb7;color:#214437;border:0;border-radius:10px;padding:11px 18px;font-weight:760;display:inline-flex;gap:12px;align-items:center}
    .cta:hover{background:#f8e9c7}
    .section-head{margin:40px 0 18px;display:flex;align-items:end;justify-content:space-between;gap:15px}
    .section-head h2{margin:4px 0 0;font-family:var(--serif);letter-spacing:.04em;font-size:27px;line-height:1.3;font-weight:750}
    .section-head p{color:var(--muted);font-size:12px;margin:0}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
    .stat{padding:21px 22px;border:1px solid #e4e4d9;border-radius:16px;background:#fffdf9}
    .stat strong{font:700 27px Georgia,serif;color:#315646;display:block;line-height:1.1;margin-bottom:8px}.stat span{font-size:12px;color:#819087}
    .region-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .region-card{display:block;width:100%;border:1px solid #e2e4da;background:#fffdf9;border-radius:17px;overflow:hidden;text-align:left;padding:0;color:var(--ink);transition:transform .2s,box-shadow .2s}
    .region-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(22,55,42,.08)}
    .card-art{height:127px;overflow:hidden;background:var(--region-pale)}.card-art svg{display:block;width:100%;height:100%;object-fit:cover}
    .rc-body{padding:17px 20px 19px}.rc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#7a857b;font:11px Georgia,serif;letter-spacing:.11em}
    .region-card h3{font:750 23px var(--serif);margin:4px 0 4px;letter-spacing:.075em}.region-card .rc-desc{color:#718079;font-size:12px;margin:0 0 12px;min-height:40px;line-height:1.75}
    .pill-line{display:flex;flex-wrap:wrap;gap:7px}.pill{border-radius:999px;border:1px solid #e4e8de;padding:3px 10px;font-size:11px;color:#5d7667;background:#f5f7f0;white-space:nowrap}
    .region-card .go{color:var(--region-accent);font-size:19px;font-weight:600}
    .compare-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .brand-card{background:#fffdf9;border:1px solid #e1e4d9;border-radius:17px;padding:21px 21px 22px}
    .brand-glyph{width:39px;height:39px;border:1px solid #d2dacc;background:#f1f4e9;display:grid;place-items:center;border-radius:11px;font-size:24px;color:#34624e}
    .brand-card h3{font:750 19px var(--serif);margin:12px 0 8px}.brand-card p{font-size:12px;color:#728178;margin:0;line-height:1.95}
    .world-note{display:flex;gap:16px;align-items:flex-start;background:#eef1e8;border:1px solid #e0e6da;border-radius:16px;padding:19px 23px;margin-top:27px;color:#53695a}
    .world-note strong{font-size:13px;color:#365242}.world-note p{font-size:12px;margin:4px 0 0;line-height:1.9}
    .region-hero{background:var(--region-dark);color:#fffaf0;border-radius:21px;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;min-height:286px}
    .region-hero .hero-copy{padding:38px 41px;position:relative;z-index:1}
    .crumb{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#c6d0c4;font-family:Georgia,serif}
    .region-hero h1{font:750 clamp(33px,4vw,52px)/1.3 var(--serif);letter-spacing:.06em;margin:16px 0 7px}
    .region-hero .subtitle{color:#efeadb;font-size:15px;margin:0 0 17px}
    .region-hero .tagline{color:#e8ebdf;font-family:var(--serif);font-size:13px;letter-spacing:.075em;margin:0 0 17px}
    .hero-spirit{display:flex;gap:8px;flex-wrap:wrap}
    .hero-spirit span{border:1px solid #ffffff66;border-radius:999px;padding:3px 11px;color:#fffdf3;font-size:11px}
    .region-hero .hero-art{position:relative;min-height:270px}.region-hero .hero-art svg{display:block;width:100%;height:100%}
    .art-disclaimer{position:absolute;bottom:13px;right:18px;color:#fff8ea;font-size:10px;text-shadow:0 1px 6px #223a32}
    .tab-scroll{display:flex;gap:5px;overflow-x:auto;border-bottom:1px solid #d9ddd2;margin-top:21px;margin-bottom:23px;scrollbar-width:thin}
    .tab-btn{border:0;background:transparent;white-space:nowrap;padding:12px 17px 13px;font-size:13px;color:#75857a;border-bottom:3px solid transparent;font-weight:620}
    .tab-btn:hover{color:#2d5a45;background:#edf1e9}.tab-btn.active{color:#254b3c;border-bottom-color:var(--region-accent);background:#eef3e9}
    .page-intro{padding:22px 25px;background:#fffdf8;border:1px solid #e9e6db;border-radius:15px;font-size:13px;color:#506b5b;line-height:2}
    .summary-row{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:18px}
    .content-card{background:#fffdf8;border:1px solid #e8e5d9;border-radius:17px;padding:24px 27px;min-width:0}
    .content-card h3{font:760 21px var(--serif);letter-spacing:.04em;margin:0 0 14px}
    .content-card h4{font-size:13px;color:#455e51;margin:19px 0 8px}
    .content-card p{font-size:12.5px;color:#64776a;line-height:2;margin:0 0 10px}
    .content-card > :last-child{margin-bottom:0}
    .micro-label{font-size:10px;color:#849489;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
    .long-quote{font:700 clamp(21px,2vw,28px)/1.7 var(--serif);letter-spacing:.06em;color:#3c6451;padding-left:20px;border-left:3px solid var(--region-accent);margin:11px 0 17px}
    .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .mini-card{border:1px solid #e5e9df;border-radius:13px;background:#fcfdf8;padding:18px 19px}
    .mini-card h4{font:700 15px var(--serif);margin:0 0 6px;color:#305645}
    .mini-card p{color:#6b7e70;margin:0;font-size:12px;line-height:1.85}
    .with-arrow{border:1px solid #dce2d5;text-align:left;width:100%;transition:background .2s}.with-arrow:hover{background:#edf3e8}
    .clickline{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#5d846f;font-size:11px}
    .inline-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tag{display:inline-block;padding:5px 10px;border:1px solid #e1e4d9;background:#f7f8f1;border-radius:8px;font-size:12px;color:#496858;line-height:1.45}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
    .flow-list{list-style:none;padding:0;margin:0}.flow-list li{padding:9px 0 9px 18px;border-bottom:1px solid #edf0e8;color:#5d6e60;font-size:12.5px;position:relative}
    .flow-list li:last-child{border-bottom:0}.flow-list li:before{content:"";background:var(--region-accent,#6c8c78);position:absolute;left:0;top:18px;width:5px;height:5px;border-radius:50%}
    .service-stack{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .service-item{background:#fcfdf8;border:1px solid #e5e8dd;border-radius:11px;padding:14px 15px}
    .service-item strong{display:block;color:#294a3d;font-size:13px;margin:0 0 4px}.service-item small{display:block;color:#74877b;font-size:11px;margin-bottom:6px}
    .service-item p{font-size:11.5px;margin:0;color:#65766b;line-height:1.75}
    .small-caps{letter-spacing:.15em;text-transform:uppercase;color:#809181;font-size:10px;font-family:Georgia,serif}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:32px 0 14px;gap:13px}
    .section-title h2{font:750 23px var(--serif);letter-spacing:.04em;margin:0}.section-title span{font-size:11px;color:#8a968a}
    .icon-title{display:flex;align-items:center;gap:10px}
    .number-square{width:26px;height:26px;border-radius:8px;background:#e6ece1;color:#46735d;display:grid;place-items:center;font:700 12px Georgia,serif}
    .brand-region{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .brand-region .brand-card{border-top:3px solid var(--region-accent);padding:21px}
    .brand-region .brand-card h3{margin:2px 0 9px}
    .brand-region .brand-card .detail{display:block;margin:11px 0 4px;font-weight:760;font-size:11px;color:#54725f}
    .brand-region .brand-card p{font-size:12px;line-height:1.85}
    .brand-region .mini-text{color:#6b776e;font-size:11.5px;line-height:1.85}
    .brand-region .offerings{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
    .brand-region .offerings span{background:#eaf1e8;padding:4px 7px;border-radius:6px;color:#3b6550;font-size:10.5px}
    .market-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .market-item{border:1px solid #e6e5d9;background:#fffdf8;border-radius:14px;padding:20px;position:relative}
    .market-item h3{font:750 18px var(--serif);margin:0 0 7px}.market-item p{font-size:12px;color:#6c7c70;line-height:1.85;margin:0}
    .market-item small{color:#91a091;font-size:11px}.market-item .place-type{font-size:10px;background:#e9efe7;padding:4px 8px;border-radius:7px;color:#5b7562;margin-bottom:11px;display:inline-block}
    .product-list{display:flex;gap:8px;flex-wrap:wrap}.product-chip{border-radius:8px;background:#f3f5ed;border:1px solid #e1e7da;padding:7px 10px;color:#486250;font-size:12px}
    .note-block{border-left:3px solid #aabfa7;padding:11px 18px;background:#f2f6ee;color:#526a58;font-size:12px;border-radius:0 9px 9px 0;line-height:1.85}
    .alert{background:#f5f0e5;border:1px solid #ebe2ce;border-radius:15px;padding:19px 21px;color:#786747;font-size:12px;line-height:1.9;display:flex;align-items:flex-start;gap:12px}
    .alert strong{color:#725d34}
    .count-badge{display:inline-block;border-radius:999px;background:#edf1e9;color:#688074;border:1px solid #e2e7dd;padding:2px 8px;font-size:10px}
    .head-tools{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .head-tools input,.head-tools select{background:#fffdf8;border:1px solid #dbe1d6;border-radius:10px;padding:9px 12px;color:#526b5b;font-size:12px;min-width:175px}
    .head-tools input{min-width:216px}
    .place-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;align-items:start}
    .place-details{background:#fffdf8;border:1px solid #e4e5d9;border-radius:14px;overflow:hidden}
    .place-details[open]{border-color:#a6bdac;box-shadow:0 8px 18px rgba(37,65,50,.05)}
    .place-details summary{padding:17px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;justify-content:space-between}
    .place-details summary::-webkit-details-marker{display:none}.place-details summary:after{content:"＋";color:#5e826b;font-size:18px;line-height:1}
    .place-details[open] summary:after{content:"−"}
    .place-details summary strong{display:block;font-size:13px;color:#2d5140}.place-details summary small{display:block;margin-top:4px;font-size:11px;color:#809083}
    .place-inner{border-top:1px solid #e5eadf;padding:0 18px 19px;color:#5e7465;font-size:12px}
    .place-inner .flow-list{margin-top:9px}.place-inner p{line-height:1.85}.place-inner .small-caps{display:block;margin-top:16px}
    .empty{padding:35px 20px;text-align:center;border-radius:14px;border:1px dashed #d3dfcf;background:#f8faf3;color:#6a8472;font-size:13px}
    .status-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .state{background:#f1f5ed;color:#4d705b;padding:2px 7px;border-radius:6px;font-size:10px;white-space:nowrap;border:1px solid #dfe9d8}.state.provisional{background:#fcf3e5;color:#85673c;border-color:#efdfc7}.state.draft{background:#f9ebdf;color:#936b40;border-color:#e8d9ca}
    .unresolved{columns:2;column-gap:23px;list-style:none;padding:0;margin:0}.unresolved li{break-inside:avoid;padding:8px 0 8px 16px;position:relative;border-bottom:1px solid #edf0e8;color:#68766b;font-size:12px}
    .unresolved li:before{content:"–";position:absolute;left:0;color:#a1b5a5}
    .source-code{font:11px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#607466;overflow-wrap:anywhere}
    .footer{border-top:1px solid #d9ded4;padding:22px 0 36px;display:flex;justify-content:space-between;gap:20px;color:#889288;font-size:11px}
    .footer strong{color:#5d7a67}
    .modal-backdrop{position:fixed;inset:0;background:rgba(13,31,27,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:11vh 20px 20px}
    .search-modal{background:#fdfcf7;max-width:750px;width:100%;max-height:80vh;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 90px #101e1880}
    .search-input-wrap{display:flex;align-items:center;gap:13px;padding:17px 22px;border-bottom:1px solid #e3e8dd}
    .search-input-wrap span{font-size:22px;color:#78927e}.search-input-wrap input{border:0;outline:0;width:100%;background:transparent;font-size:17px;color:#253b2e}.search-input-wrap button{border:1px solid #dce4da;background:#f1f3ec;border-radius:7px;color:#788b7e;font-size:11px;padding:5px 8px}
    .resultmeta{font-size:11px;letter-spacing:.05em;color:#879889;padding:13px 24px;border-bottom:1px solid #eef0e9}
    .results{overflow:auto;scrollbar-width:thin;padding:7px 13px 16px}
    .result{display:flex;align-items:start;justify-content:space-between;gap:12px;width:100%;padding:13px;border:0;background:transparent;text-align:left;border-radius:10px;color:#345241}
    .result:hover,.result:focus{background:#eef3e9}.result strong{font-size:14px}.result small{display:block;font-size:11px;color:#87968a;margin-top:3px}.result-kind{border:1px solid #dbe6d7;background:#f2f5ed;border-radius:7px;padding:3px 7px;font-size:10px;flex-shrink:0}
    .search-hint{font-size:12px;color:#7c8d80;padding:24px}.search-hint b{color:#587160}

    <button class="mini-card with-arrow" data-tab="commerce"><div class="micro-label">02 / COMMERCE</div><h4>逛一間地方商店</h4><p>從一盞燈與晨食堂，到地方工坊、市集與特產。</p><span class="clickline">商鋪市場 <span>↗</span></span></button>
    <button class="mini-card with-arrow" data-tab="services"><div class="micro-label">03 / EVERYDAY LIFE</div><h4>讓生活運作的設施</h4><p>郵政、學舍、醫療、旅宿資訊、物流、金融與安全。</p><span class="clickline">生活服務 <span>↗</span></span></button></div>
    ${subtitle('重要聚落','正式聚落及其主要分工')}<div class="mini-grid">${r.settlements.map(s=>`<div class="mini-card"><div class="micro-label">${esc(s.id)}</div><h4>${esc(s.name)}</h4><p>${esc(s.functions.slice(0,4).join('、'))}</p></div>`).join('')}</div>
    <div class="world-note"><span style="font-size:19px" aria-hidden="true">◌</span><div><strong>需要注意的環境與安全</strong><p>${esc(r.safety)}</p></div></div>`;
  }
  function geoCard(title,arr,stat='confirmed'){
    return `<div class="content-card"><div class="micro-label">${stat==='confirmed'?'已確認資訊':stat==='provisional'?'部分暫定資訊':'設定資訊'}</div><h3>${esc(title)} ${stat==='provisional'?'<span class="state provisional">暫定</span>':''}</h3>${arr&&arr.length?ul(arr):`<p>目前尚未正式設定。</p>`}</div>`;
  }
  function culturePage(r){
    const arch=r.architecture;
    return `${subtitle('風土地理','地形、氣候與水源')}<div class="grid2">${geoCard('地貌與地形',r.geography.terrain)}${geoCard('天候與季節',r.geography.climate)}${geoCard('水系與取水',r.geography.namedWater.length?r.geography.namedWater.map(w=>r.id==='REGION-002'?w.name+'：'+w.note:w.name):r.geography.water,r.geography.waterStatus)}${geoCard('居民聚落型態',r.geography.settlement)}</div>
    ${subtitle('聚落與居民','地方生活需要的不只是美景')}<div class="mini-grid">${r.settlements.map(s=>`<div class="mini-card"><div class="micro-label">${esc(s.id)}</div><h4>${esc(s.name)}</h4>${ul(s.functions.slice(0,5))}</div>`).join('')}</div>
    ${r.cityZones.length?`${subtitle('城市功能分區','城市分區並非次級行政區')}<div class="mini-grid">${r.cityZones.map(z=>`<div class="mini-card"><h4>${esc(z.name)}</h4><p>${esc(z.functions.join('、'))}</p></div>`).join('')}</div>`:''}
    ${subtitle('文化與生活習俗','文化傾向不代表所有居民都相同')}<div class="summary-row"><div class="content-card"><div class="micro-label">CORE SPIRIT</div><h3>${esc(r.culture.themes.join('・'))}</h3><div class="long-quote">${esc((r.culture.sayings||[])[0]||r.tag)}</div><p>${esc(r.culture.summary)}</p>${r.culture.belief?`<h4>地方共同世界觀｜${esc(r.culture.belief)}</h4>${ul(r.culture.beliefPrinciples.slice(0,6))}<p style="font-size:11px;color:#87958a;margin-top:8px">地方倫理不自動等於統一宗教或超自然事實。</p>`:''}</div><div class="content-card"><h3>地方習俗</h3>${r.culture.customs.length?r.culture.customs.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #edf0e8"><strong style="color:#2e5641;font-size:13px">${esc(x.name)}</strong><p style="margin:5px 0 0">${esc(x.description)}</p></div>`).join(''):'<p>目前無具名正式習俗。</p>'}</div></div>
    ${subtitle('街巷與建築','居民每天使用的空間')}<div class="grid2"><div class="content-card"><h3>建築材料與形式</h3>${arch.core?`<div class="note-block">${esc(arch.core)}</div>`:''}<h4>常見材料</h4><div class="inline-tags">${t(arch.materials)}</div><h4>常見建築形式</h4>${ul(arch.forms.slice(0,11))}</div><div class="content-card"><h3>居民生活與職業</h3><p>常見職業原型是創作參考，不是固定人格，也不代表每位居民都從事這些工作。</p><div class="inline-tags">${t(r.npc.slice(0,24))}</div>${r.culture.residentValues.length?`<h4>地方重視的價值 ${r.culture.valuesStatus==='provisional'?'<span class="state provisional">暫定</span>':''}</h4>${ul(r.culture.residentValues.slice(0,8))}`:''}</div></div>`;
  }
  function distribution(title,list){return list&&list.length?`<span class="detail">${esc(title)}</span><div class="mini-text">${esc(list.join('、'))}</div>`:'';}
  function commercePage(r){
    const market=r.features.filter(f=>(marketIds[r.id]||[]).includes(f.name));
    return `<div class="page-intro">${esc(r.name)}的主要產業包括：${esc(role(r.commerce.industries.slice(0,8)))}。本區商業資訊區分「生活品牌」、「獨立地方商鋪」與「產業批發及物流」，精確店數與營業時間並未設定。</div>
    ${subtitle('跨區生活品牌','同一品牌，在各地供應不同商品')}
    <div class="brand-region">${r.commerce.brands.map(b=>`<div class="brand-card"><div class="small-caps">${esc(brandIntro[b.name]?.[0]||'生活品牌')}</div><h3>${esc(b.name)}</h3><p>${esc(b.role||brandIntro[b.name]?.[1]||'服務當地居民生活')}</p>${distribution('主要分布',b.primary)}${distribution('有限分布',b.limited)}${distribution('不設一般門市',b.absent)}${b.offerings.length?`<span class="detail">地方商品與餐飲</span><div class="offerings">${b.offerings.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}${!b.primary.length&&!b.limited.length?`<div class="mini-text" style="margin-top:12px">分布以文字角色說明；本版未登錄精確分店位置。</div>`:''}</div>`).join('')}</div>
    ${subtitle('在地商鋪圖鑑',`${r.commerce.shopTypes.length} 種常見商店類型`)}<div class="content-card"><h3>地方生活不只有連鎖店</h3><p>以下是正式區域資料中列出的常見店型，並非所有商店都有獨立店名或已確認地址。</p><div class="inline-tags">${t(r.commerce.shopTypes)}</div></div>
    ${subtitle('代表市集・商街',market.length+' 個具名節點')}
    ${market.length?`<div class="market-strip">${market.map(f=>`<div class="market-item"><span class="place-type">${esc(f.kind)}</span><h3>${esc(f.name)}</h3><p>${esc(f.functions.slice(0,4).join('、'))}</p>${f.zone?`<small>位置：${esc(f.zone)}</small>`:''}${r.id==='REGION-004'&&f.name==='燈階夜集'?'<p style="margin-top:11px;font-size:11px">正式層級：月照鎮 → 微燈巷 → 燈階夜集；商圈與夜市不是同一實體。</p>':''}</div>`).join('')}</div>`:none('本區尚未建立獨立具名的代表綜合市集；地方商業以聚落分工及工坊商店為主。')}
    ${subtitle('各聚落的商業分工','依正式商業空間模式整理')}<div class="mini-grid">${r.commerce.patterns.map(p=>`<div class="mini-card"><h4>${esc(p.name)}</h4><p>${esc(p.activities.join('、'))}</p></div>`).join('')}</div>
    ${subtitle('地方食物與工藝','可以出現在書信裡的生活物件')}<div class="grid2"><div class="content-card"><h3>地方食物・飲品</h3><div class="product-list">${r.products.foods.map(p=>`<span class="product-chip" title="${esc(p.description)}">${esc(p.name)}</span>`).join('')}</div></div><div class="content-card"><h3>工藝・生活物件</h3><div class="product-list">${r.products.crafts.map(p=>`<span class="product-chip" title="${esc(p.description)}">${esc(p.name)}</span>`).join('')}</div></div></div>${r.products.souvenirs.length?`<div class="content-card" style="margin-top:16px"><h3>地方紀念品</h3><div class="product-list">${r.products.souvenirs.map(p=>`<span class="product-chip">${esc(p.name)}</span>`).join('')}</div></div>`:''}`;
  }
  function servicesPage(r){
    let items=serviceItems(r);
    const categories=groupKinds.filter(g=>items.some(f=>kindLabel(f)===g));
    return `<div class="alert"><span aria-hidden="true" style="font-size:22px">⚑</span><div><strong>營運狀態不是即時資訊</strong><br>${esc(r.safety)}<br>下列設施的「已確認」只代表世界設定已確認，不表示當下有營業、開放或可通行。</div></div>
    ${r.id==='REGION-001'?`<div class="content-card" style="margin-top:16px"><h3>霧港領醫療與金融</h3><p>區域具首都級醫療與金融功能，但首都級具名醫療設施與星契所分所目前尚未補齊，因此不以虛構名稱展示。</p></div>`:''}
    ${categories.map(g=>`${subtitle(g,`${items.filter(f=>kindLabel(f)===g).length} 個具名設施`)}<div class="service-stack">${items.filter(f=>kindLabel(f)===g).map(f=>`<div class="service-item"><strong>${esc(f.name)}</strong><small>${f.zone?`${esc(f.zone)} · `:''}世界設定：已確認</small><p>${esc(f.functions.slice(0,4).join('、'))}</p></div>`).join('')}</div>`).join('')}
    ${subtitle('產業與跨區往來','物流、集貨與金融各司其職')}<div class="content-card"><p>百川集負責商品分級、批次與集貨交易；風行社負責實際轉運；星契所提供居民金融、交易結算與地方產業支持。公共安全、醫療與地方治理決定不受市場交易要求取代。</p><div class="inline-tags">${t(r.commerce.industries.slice(0,10))}</div></div>`;
  }
  function placesPage(r){
    const kinds=[...new Set(r.features.map(kindLabel))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    return `<div class="page-intro">所有具名地點與設施，分別標示所在功能區、類型及已確認的職能。這是世界觀名錄，不代表可以直接到訪或預約。</div>
    <div class="section-title"><h2>地點與機構名錄 <span class="count-badge" id="dirCount">${r.features.length} 筆</span></h2><div class="head-tools"><input id="dirSearch" type="search" placeholder="在本區搜尋地點…" aria-label="在本區搜尋地點"><select id="dirKind" aria-label="地點類型"><option value="全部">全部類型</option>${kinds.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}</select></div></div>
    <div class="place-list" id="dirList">${r.features.map(f=>`<details class="place-details" data-find="${esc([f.name,f.kind,kindLabel(f),f.zone,...f.functions].join(' ').toLowerCase())}" data-kind="${esc(kindLabel(f))}"><summary><span><strong>${esc(f.name)}</strong><small>${esc(kindLabel(f))}${f.zone?' · '+esc(f.zone):''}</small></span></summary><div class="place-inner">${f.definition?`<p>${esc(f.definition)}</p>`:''}<span class="small-caps">主要功能</span>${ul(f.functions)}${f.constraint?`<div class="note-block" style="margin-top:13px">${esc(f.constraint)}</div>`:''}</div></details>`).join('')}</div><div class="empty" id="dirEmpty" hidden>沒有符合條件的地點，請改用其他搜尋字詞。</div>`;
  }
  function canonPage(r){
    const drafts=r.culture.draft||[];
    return `<div class="page-intro"><strong>資料不是故事的空白支票。</strong> 網頁只彙整目前正式來源已記載的名稱、事物與生活脈絡。尚未決定的資料保留原狀，不以看似合理的數值與地名填滿。</div>
    ${subtitle('資料來源與成熟度','世界設定的可追溯性')}<div class="grid2"><div class="content-card"><h3>行政區正式版本</h3><p>設定狀態 <span class="state">${esc(r.canonicalStatus)}｜已確認</span></p><p>資料更新：${esc(r.updated)}<br>主檔版本：v${esc(r.version)}<br>Schema 版本：${esc(r.schema)}</p><h4>結構化正式來源</h4><div class="source-code">${esc(r.sourceYaml)}</div><h4>敘事及人文閱讀版</h4><div class="source-code">${esc(r.sourceMarkdown)}</div></div><div class="content-card"><h3>狀態如何解讀</h3>${ul(['confirmed｜已由專案確認，可作為世界內正式設定。','provisional｜暫定內容，可能調整，需明示。','draft｜只供提案參考，不可視為已存在。','unset｜目前尚未設定，不得自行補值。','deferred｜刻意延後，等待比例尺、制度等前置條件。'])}</div></div>
    ${subtitle('尚未設定 / 延後處理',r.unresolved.length+' 項具體待決議題')}<div class="content-card"><ul class="unresolved">${r.unresolved.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="note-block" style="margin-top:17px">全大陸共同未定資料：行政邊界與相鄰關係、比例尺與交通時間、人口與密度、精確商店數及攤位數、市場營業時段、部分節慶及排行榜。這些資料不會因展示網頁而自動成為正式世界觀。</div></div>
    ${drafts.length?`${subtitle('文化草案','尚未升級為正式設定')}<div class="content-card"><div class="inline-tags">${drafts.map(x=>`<span class="tag" style="background:#fcf2e9;color:#92683f;border-color:#e9d6c1">${esc(x)} · 草案</span>`).join('')}</div></div>`:''}
    <div class="world-note"><span style="font-size:22px">ⓘ</span><div><strong>Canon 與營運狀態分開</strong><p>一間已確認存在的店舖，不代表它此刻「營業中」；一處已確認的步道，不代表它在高風險天候可進入。本站不含即時狀態資料與精確地圖座標。新名稱及新增數字，應先經專案確認再回寫正式 YAML。</p></div></div>`;
  }
  function bindDirectory(){
    const q=$('#dirSearch'),kind=$('#dirKind');if(!q||!kind)return;
    q.value=state.directoryQuery;kind.value=state.directoryKind;
    const update=()=>{
      state.directoryQuery=q.value;state.directoryKind=kind.value;
      const query=slug(q.value).toLowerCase();let visible=0;
      $$('.place-details', $('#dirList')).forEach(el=>{const ok=(!query||el.dataset.find.includes(query))&&(kind.value==='全部'||el.dataset.kind===kind.value);el.hidden=!ok;if(ok)visible++;});
      $('#dirCount').textContent=`${visible} 筆`;$('#dirEmpty').hidden=visible!==0;
    };
    q.addEventListener('input',update);kind.addEventListener('change',update);update();
  }
  const searchIndex=[];
  function addSearch(region,tab,kind,name,detail=''){
    if(!name)return;
    searchIndex.push({rid:region.id,region:region.name,tab,kind,name:slug(name),detail:slug(detail),
      key:(String(name)+' '+String(detail)+' '+region.name+' '+kind).toLocaleLowerCase()});
  }
  regions.forEach(r=>{
    addSearch(r,'overview','行政區',r.name,`${r.nature} ${r.culture.themes.join(' ')} ${r.subtitle}`);
    r.settlements.forEach(x=>addSearch(r,'culture','聚落',x.name,x.functions.join(' ')));
    r.features.forEach(x=>addSearch(r,'places',kindLabel(x),x.name,x.functions.join(' ')));
    r.commerce.shopTypes.forEach(x=>addSearch(r,'commerce','商鋪種類',x,'在地商店'));
    r.commerce.brands.forEach(x=>addSearch(r,'commerce','生活品牌',x.name,x.role+' '+x.offerings.join(' ')));
    r.products.foods.forEach(x=>addSearch(r,'commerce','地方食物',x.name,x.description));
    r.products.crafts.forEach(x=>addSearch(r,'commerce','地方工藝',x.name,x.description));
    r.culture.customs.forEach(x=>addSearch(r,'culture','生活習俗',x.name,x.description));
    r.culture.themes.forEach(x=>addSearch(r,'culture','文化精神',x,'地方文化核心'));
  });
  function showSearch(){const l=$('#searchLayer');l.hidden=false;document.body.style.overflow='hidden';const input=$('#searchInput');input.value='';paintSearch();requestAnimationFrame(()=>input.focus());}
  function hideSearch(){const l=$('#searchLayer');l.hidden=true;document.body.style.overflow='';}
  function paintSearch(){
    const q=slug($('#searchInput').value).toLocaleLowerCase();const el=$('#searchResults');
    if(!q){el.innerHTML='<div class="search-hint">全站收錄 <b>7 個行政區</b>的商鋪、產物、文化、具名地點與服務機構。<br>試試「<b>晨食堂</b>」、「<b>風</b>」、「<b>暖谷</b>」或「<b>白羽院</b>」。</div>';$('#searchMeta').textContent='輸入關鍵字，跨七區搜尋';return;}
    const parts=q.split(/\s+/).filter(Boolean);const matched=searchIndex.filter(a=>parts.every(word=>a.key.includes(word))).sort((a,b)=>{
      const rank=x=>(x.name.toLocaleLowerCase()===q?0:x.name.toLocaleLowerCase().startsWith(q)?1:x.name.toLocaleLowerCase().includes(q)?2:3);
      return rank(a)-rank(b)||a.region.localeCompare(b.region,'zh-Hant');
    });
    $('#searchMeta').textContent=`符合「${q}」的結果：${matched.length} 筆${matched.length>65?'（先顯示前 65 筆）':''}`;
    el.innerHTML=matched.length?matched.slice(0,65).map(x=>`<button class="result" data-result-region="${esc(x.rid)}" data-result-tab="${esc(x.tab)}"><span><strong>${esc(x.name)}</strong><small>${esc(x.region)} · ${esc(max(x.detail,95))}</small></span><span class="result-kind">${esc(x.kind)}</span></button>`).join(''):'<div class="search-hint">沒有找到相關資料。世界資料若尚未設定，就不會出現在搜尋結果中。</div>';
  }
  document.addEventListener('click',ev=>{
    const target=ev.target.closest('button');if(!target)return;
    if(target.dataset.region){navigate(target.dataset.region);return;}
    if(target.dataset.tab){selectTab(target.dataset.tab);return;}
    if(target.dataset.resultRegion){const rid=target.dataset.resultRegion,tab=target.dataset.resultTab;hideSearch();navigate(rid,tab);return;}
    switch(target.dataset.action){
      case 'home':navigate();break;
      case 'explore':navigate();requestAnimationFrame(()=>$('#explore')?.scrollIntoView({behavior:'smooth'}));break;
      case 'brands':navigate();requestAnimationFrame(()=>$('#brandSection')?.scrollIntoView({behavior:'smooth'}));break;
      case 'search':showSearch();break;
      case 'close-search':hideSearch();break;
    }
  });
  $('#searchLayer').addEventListener('click',ev=>{if(ev.target.id==='searchLayer')hideSearch();});
  $('#searchInput').addEventListener('input',paintSearch);
  document.addEventListener('keydown',ev=>{
    if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();if($('#searchLayer').hidden)showSearch();else hideSearch();}
    if(ev.key==='Escape'&&!$('#searchLayer').hidden){hideSearch();}
    if(ev.key==='Enter'&&!$('#searchLayer').hidden&&document.activeElement===$('#searchInput')){const first=$('.result');if(first)first.click();}
  });
  let hash=location.hash||'';
  const match=hash.match(/^#region-(\d{3})-(overview|administration|culture|commerce|services|places|canon)$/i);
  if(match&&regionById['REGION-'+match[1]]){state.region='REGION-'+match[1];state.tab=match[2];}
  sidebar();renderMain();
})();
</script>
</body></html>
